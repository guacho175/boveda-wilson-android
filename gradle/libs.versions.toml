[versions]
agp = "8.13.1"
kotlin = "2.2.20"
ksp = "2.2.20-2.0.4"
detekt = "1.23.8"
composeCompiler = "1.5.15"
composeBom = "2024.06.00"
activityCompose = "1.13.0"
navigationCompose = "2.9.8"
# 2.60.x exige AGP 9.0+; este proyecto está en AGP 8.13.1 (ver `agp` arriba). Al subir AGP,
# revisar esta versión junto con `hiltExt`.
hilt = "2.57.2"
hiltExt = "1.3.0"
room = "2.8.4"
firebaseBom = "34.16.0"
googleServices = "4.5.0"
biometric = "1.1.0"
work = "2.11.2"
datastore = "1.2.1"
kotlinxSerialization = "1.9.0"
lifecycle = "2.8.7"
coroutines = "1.10.2"
tink = "1.23.0"
bouncycastle = "1.85"
bip39 = "1.0.9"
junit = "4.13.2"
androidxTestRunner = "1.7.0"
androidxTestCore = "1.7.0"
androidxTestJunit = "1.3.0"
espresso = "3.7.0"
credentials = "1.5.0"
googleId = "1.1.1"
mockitoKotlin = "5.1.0"
mockitoCore = "5.2.0"

[libraries]
# Compose
compose-bom            = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
compose-compiler       = { group = "androidx.compose.compiler", name = "compiler", version.ref = "composeCompiler" }
compose-ui             = { group = "androidx.compose.ui", name = "ui" }
compose-ui-graphics    = { group = "androidx.compose.ui", name = "ui-graphics" }
compose-ui-tooling     = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-foundation     = { group = "androidx.compose.foundation", name = "foundation" }
compose-material3      = { group = "androidx.compose.material3", name = "material3" }
compose-material-icons = { group = "androidx.compose.material", name = "material-icons-extended" }
compose-runtime        = { group = "androidx.compose.runtime", name = "runtime" }
activity-compose       = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
navigation-compose     = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }
hilt-navigation-compose = { group = "androidx.hilt", name = "hilt-navigation-compose", version.ref = "hiltExt" }

# Inyección de dependencias
hilt-android           = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler          = { group = "com.google.dagger", name = "hilt-compiler", version.ref = "hilt" }
hilt-work              = { group = "androidx.hilt", name = "hilt-work", version.ref = "hiltExt" }
hilt-ext-compiler      = { group = "androidx.hilt", name = "hilt-compiler", version.ref = "hiltExt" }

# Datos (declaradas ya, se usan a partir de la Fase 3)
room-runtime           = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
room-ktx               = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
room-compiler          = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
room-testing           = { group = "androidx.room", name = "room-testing", version.ref = "room" }
datastore-preferences  = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
work-runtime-ktx       = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "work" }
work-testing           = { group = "androidx.work", name = "work-testing", version.ref = "work" }
firebase-bom           = { group = "com.google.firebase", name = "firebase-bom", version.ref = "firebaseBom" }
firebase-auth          = { group = "com.google.firebase", name = "firebase-auth" }
firebase-firestore     = { group = "com.google.firebase", name = "firebase-firestore" }
firebase-appcheck-debug = { group = "com.google.firebase", name = "firebase-appcheck-debug" }
firebase-appcheck-playintegrity = { group = "com.google.firebase", name = "firebase-appcheck-playintegrity" }
credentials             = { group = "androidx.credentials", name = "credentials", version.ref = "credentials" }
credentials-play-services-auth = { group = "androidx.credentials", name = "credentials-play-services-auth", version.ref = "credentials" }
google-id               = { group = "com.google.android.libraries.identity.googleid", name = "googleid", version.ref = "googleId" }

# Criptografía (declaradas ya, se usan a partir de la Fase 2)
tink-android           = { group = "com.google.crypto.tink", name = "tink-android", version.ref = "tink" }
bouncycastle           = { group = "org.bouncycastle", name = "bcprov-jdk18on", version.ref = "bouncycastle" }
kotlin-bip39           = { group = "cash.z.ecc.android", name = "kotlin-bip39", version.ref = "bip39" }
biometric              = { group = "androidx.biometric", name = "biometric", version.ref = "biometric" }

# Comunes
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
coroutines-core        = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
coroutines-android     = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
lifecycle-process      = { group = "androidx.lifecycle", name = "lifecycle-process", version.ref = "lifecycle" }
lifecycle-runtime      = { group = "androidx.lifecycle", name = "lifecycle-runtime", version.ref = "lifecycle" }
lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }

# Pruebas
junit                  = { group = "junit", name = "junit", version.ref = "junit" }
coroutines-test        = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
hilt-android-testing   = { group = "com.google.dagger", name = "hilt-android-testing", version.ref = "hilt" }
androidx-test-runner   = { group = "androidx.test", name = "runner", version.ref = "androidxTestRunner" }
androidx-test-core     = { group = "androidx.test", name = "core", version.ref = "androidxTestCore" }
androidx-test-junit    = { group = "androidx.test.ext", name = "junit", version.ref = "androidxTestJunit" }
espresso-core          = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espresso" }
detekt-formatting      = { group = "io.gitlab.arturbosch.detekt", name = "detekt-formatting", version.ref = "detekt" }
mockito-kotlin         = { group = "org.mockito.kotlin", name = "mockito-kotlin", version.ref = "mockitoKotlin" }
mockito-core           = { group = "org.mockito", name = "mockito-core", version.ref = "mockitoCore" }

[plugins]
android-application    = { id = "com.android.application", version.ref = "agp" }
android-library        = { id = "com.android.library", version.ref = "agp" }
kotlin-android         = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm             = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose         = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization   = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp                    = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt                   = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
detekt                 = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
google-services        = { id = "com.google.gms.google-services", version.ref = "googleServices" }
