name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout completo para escaneo de historial
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Configurar Java 17 para Android
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - name: Validar wrapper, pruebas, análisis y APK debug
        run: ./gradlew --no-daemon test lint detekt assembleDebug

      - name: Escanear secretos en árbol e historial
        shell: pwsh
        run: ./scripts/scan-secrets.ps1 -History

  firebase-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Configurar Java 21 para Emulator Suite
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"

      - name: Configurar Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: firebase/package-lock.json

      - name: Instalar dependencias fijadas
        working-directory: firebase
        run: npm ci

      - name: Bloquear vulnerabilidades altas o críticas en herramientas Node
        working-directory: firebase
        run: npm audit --audit-level=high

      - name: Probar Security Rules en emuladores
        working-directory: firebase
        run: npm test
